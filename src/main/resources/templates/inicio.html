<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio | HomeStore</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e8c8f0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .contenedor-inicio {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .card-inicio {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(100, 30, 150, 0.18);
            padding: 3rem;
            max-width: 1050px;
            width: 100%;
            text-align: center;
        }

        .logo-inicio {
            max-width: 360px;
            width: 100%;
            margin-bottom: 2.5rem;
        }

        .titulo {
            color: #2d1b6e;
            font-weight: 800;
            font-size: 2.5rem;
        }

        .usuario {
            color: #2d1b6e;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }

        .mensaje {
            color: #4a3570;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        .btn-salir {
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-salir:hover {
            color: white;
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="contenedor-inicio">

    <div class="card-inicio">

        <img th:src="@{/images/logo.png}"
             src="/images/logo.png"
             alt="HomeStore"
             class="logo-inicio">

        <h1 class="titulo">¡Bienvenido!</h1>

        <h2 class="usuario" th:text="${usuario.name}">
            Usuario
        </h2>

        <p class="mensaje">
            Has iniciado sesión correctamente en HomeStore.
        </p>

        <a th:href="@{/logout}" class="btn-salir">
            Cerrar sesión
        </a>

    </div>

</div>

</body>
</html>
