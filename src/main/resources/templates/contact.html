<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      th:lang="${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{contacto.pagina.titulo}">
        Contacto | HomeStore
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            background-color: #e8c8f0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .navbar {
            border-bottom: 1px solid #f0e0f5;
        }

        .nav-link {
            color: #2d1b6e !important;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
            z-index: 10;
        }

        .nav-link:hover {
            color: #b020cc !important;
        }

        .nav-link.active {
            color: #b020cc !important;
            font-weight: 700;
        }

        .btn-lang {
            background: none;
            border: none;
            color: #2d1b6e;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 6px;
        }

        .btn-lang:hover {
            color: #b020cc;
        }

        .btn-sesion {
            background: #e8d8f5;
            color: #2d1b6e;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .btn-sesion:hover {
            background: #d8c5eb;
            color: #2d1b6e;
        }


        .contact-section {
            padding: 3.5rem 1.5rem;
        }

        .contact-card {
            width: 100%;
            max-width: 850px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 22px;
            padding: 3rem;
            box-shadow: 0 10px 30px rgba(100, 30, 150, 0.12);
        }

        .contact-title {
            color: #2d1b6e;
            font-weight: 800;
            text-align: center;
            margin-bottom: 0.7rem;
        }

        .contact-subtitle {
            color: #7a6a9a;
            text-align: center;
            margin-bottom: 2.5rem;
            font-size: 1rem;
        }

        .form-label {
            color: #2d1b6e;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid #eadff2;
            border-radius: 10px;
            padding: 0.8rem 0.9rem;
            font-size: 1rem;
        }

        .form-control:focus {
            border-color: #c13ddd;
            box-shadow: 0 0 0 0.2rem rgba(193, 61, 221, 0.12);
        }

        textarea.form-control {
            min-height: 170px;
            resize: vertical;
        }

        .btn-contacto {
            width: 100%;
            background: linear-gradient(135deg, #d44de8, #b020cc);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.85rem 1.8rem;
            font-weight: 700;
            font-size: 1rem;
            transition: 0.2s;
        }

        .btn-contacto:hover {
            color: white;
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .star-rating {
            font-size: 2rem;
            color: #d6c2e8;
            cursor: pointer;
        }

        .star-rating .star.selected,
        .star-rating .star:hover {
            color: #d44de8;
        }

        .btn-opinion {
            background: linear-gradient(135deg, #d44de8, #b020cc);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 0.65rem 1.6rem;
            font-weight: 600;
        }

        .btn-opinion:hover {
            color: white;
            opacity: 0.9;
        }

        @media (max-width: 991px) {

            .navbar .container-fluid,
            .navbar .d-flex {
                flex-wrap: wrap;
            }

            .contact-card {
                padding: 2rem 1.5rem;
            }
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light bg-white">

    <div class="container-fluid px-4">

        <a class="navbar-brand"
           th:href="@{/}">

            <img th:src="@{/images/logo.png}"
                 src="/images/logo.png"
                 alt="HomeStore"
                 style="height: 80px;">

        </a>

        <div class="d-flex align-items-center gap-4 ms-auto">

            <a class="nav-link"
               th:href="@{/}"
               th:text="#{menu.inicio}">
                Inicio
            </a>

            <a class="nav-link"
               th:href="@{/productos}"
               th:text="#{menu.productos}">
                Productos
            </a>

            <a class="nav-link"
               th:href="@{/categories}"
               th:text="#{menu.categorias}">
                Categorías
            </a>

            <a class="nav-link"
               th:href="@{/cart}"
               th:text="#{menu.carrito}">
                Carrito
            </a>

            <a class="nav-link"
               th:href="@{/nosotros}"
               th:text="#{menu.nosotros}">
                Nosotros
            </a>

            <a class="nav-link active"
               th:href="@{/contact}"
               th:text="#{menu.contacto}">
                Contacto
            </a>

            <a class="nav-link"
               th:href="@{/location}"
               th:text="#{menu.ubicacion}">
                Ubicación
            </a>

            <a class="nav-link"
               href="#"
               data-bs-toggle="modal"
               data-bs-target="#opinionModal"
               th:text="#{menu.opinion}">
                Opinión
            </a>

            <a class="btn-lang text-decoration-none"
               th:href="@{/contact(lang='es')}">
                ES
            </a>

            <a class="btn-lang text-decoration-none"
               th:href="@{/contact(lang='en')}">
                EN
            </a>

            <a class="btn-sesion ms-2 text-decoration-none"
               th:href="@{/inicio}"
               th:text="#{menu.iniciarSesion}">
                Inicio de Sesión
            </a>

        </div>

    </div>

</nav>

<main class="contact-section">

    <section class="contact-card">

        <h1 class="contact-title"
            th:text="#{contacto.titulo}">
            Contáctanos
        </h1>

        <p class="contact-subtitle"
           th:text="#{contacto.descripcion}">
            Envíanos un mensaje y con gusto atenderemos tu consulta.
        </p>

        <!-- Mensaje de éxito -->
        <div class="alert alert-success"
             th:if="${ok}">

            <span th:text="${ok}">
                Mensaje enviado correctamente.
            </span>

        </div>

        <!-- Mensaje de error -->
        <div class="alert alert-danger"
             th:if="${error}">

            <span th:text="${error}">
                No se pudo enviar el mensaje.
            </span>

        </div>

        <form th:action="@{/contact}"
              method="post">

            <!-- Nombre -->
            <div class="mb-4">

                <label for="nombre"
                       class="form-label"
                       th:text="#{contacto.nombre}">
                    Nombre
                </label>

                <input type="text"
                       id="nombre"
                       name="nombre"
                       class="form-control"
                       th:placeholder="#{contacto.nombre.placeholder}"
                       placeholder="Ingresa tu nombre"
                       required>

            </div>


            <!-- Correo -->
            <div class="mb-4">

                <label for="correo"
                       class="form-label"
                       th:text="#{contacto.correo}">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       name="correo"
                       class="form-control"
                       th:placeholder="#{contacto.correo.placeholder}"
                       placeholder="Ingresa tu correo electrónico"
                       required>

            </div>


            <!-- Asunto -->
            <div class="mb-4">

                <label for="asunto"
                       class="form-label"
                       th:text="#{contacto.asunto}">
                    Asunto
                </label>

                <input type="text"
                       id="asunto"
                       name="asunto"
                       class="form-control"
                       th:placeholder="#{contacto.asunto.placeholder}"
                       placeholder="Escribe el asunto"
                       required>

            </div>


            <!-- Mensaje -->
            <div class="mb-4">

                <label for="mensaje"
                       class="form-label"
                       th:text="#{contacto.mensaje}">
                    Mensaje
                </label>

                <textarea id="mensaje"
                          name="mensaje"
                          class="form-control"
                          th:placeholder="#{contacto.mensaje.placeholder}"
                          placeholder="Escribe tu mensaje"
                          required>
                </textarea>

            </div>


            <!-- Enviar -->
            <button type="submit"
                    class="btn-contacto"
                    th:text="#{contacto.enviar}">
                Enviar mensaje
            </button>

        </form>

    </section>

</main>

<div class="modal fade"
     id="opinionModal"
     tabindex="-1"
     aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content rounded-4 border-0">

            <div class="modal-header">

                <h5 class="modal-title fw-bold"
                    style="color:#2d1b6e;"
                    th:text="#{opinion.titulo}">
                    Opinión pública
                </h5>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body text-center">

                <p style="color:#6f5a95;"
                   th:text="#{opinion.descripcion}">
                    Valora la funcionalidad del sistema.
                </p>

                <div class="star-rating mb-3">

                    <span class="star"
                          data-value="1">★</span>

                    <span class="star"
                          data-value="2">★</span>

                    <span class="star"
                          data-value="3">★</span>

                    <span class="star"
                          data-value="4">★</span>

                    <span class="star"
                          data-value="5">★</span>

                </div>

                <button type="button"
                        class="btn-opinion"
                        th:text="#{opinion.enviar}">
                    Enviar opinión
                </button>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
