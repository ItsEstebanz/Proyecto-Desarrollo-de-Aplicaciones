<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{contacto.pagina.titulo}">
        Contacto | HomeStore
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container py-5">

    <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5">

        <h1 class="mb-3"
            th:text="#{contacto.titulo}">
            Contáctanos
        </h1>

        <p class="text-muted mb-4"
           th:text="#{contacto.descripcion}">
            Si tienes alguna consulta, puedes comunicarte con nosotros.
        </p>

        <form>

            <div class="mb-3">

                <label for="nombre"
                       class="form-label"
                       th:text="#{contacto.nombre}">
                    Nombre
                </label>

                <input type="text"
                       id="nombre"
                       class="form-control"
                       th:placeholder="#{contacto.nombre.placeholder}"
                       placeholder="Ingresa tu nombre">

            </div>

            <div class="mb-3">

                <label for="correo"
                       class="form-label"
                       th:text="#{contacto.correo}">
                    Correo electrónico
                </label>

                <input type="email"
                       id="correo"
                       class="form-control"
                       th:placeholder="#{contacto.correo.placeholder}"
                       placeholder="Ingresa tu correo electrónico">

            </div>

            <div class="mb-3">

                <label for="mensaje"
                       class="form-label"
                       th:text="#{contacto.mensaje}">
                    Mensaje
                </label>

                <textarea id="mensaje"
                          class="form-control"
                          rows="5"
                          th:placeholder="#{contacto.mensaje.placeholder}"
                          placeholder="Escribe tu mensaje"></textarea>

            </div>

            <button type="submit"
                    class="btn btn-primary"
                    th:text="#{contacto.enviar}">
                Enviar mensaje
            </button>

            <a th:href="@{/}"
               href="/"
               class="btn btn-outline-secondary ms-2"
               th:text="#{contacto.volverInicio}">
                Volver al inicio
            </a>

        </form>

    </div>

</div>

</body>
</html>
