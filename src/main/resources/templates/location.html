<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HomeStore - Ubicación</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #e8c8f0;
            min-height: 100vh;
        }

        .navbar {
            border-bottom: 1px solid #f0e0f5;
        }

        .nav-link {
            color: #2d1b6e !important;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .btn-lang {
            background: none;
            border: none;
            color: #2d1b6e;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0 6px;
        }

        .btn-sesion {
            background: #e8d8f5;
            color: #2d1b6e;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .location-card {
            background: white;
            border-radius: 25px;
            padding: 50px;
            box-shadow: 0 10px 30px rgba(100, 30, 150, 0.10);
        }

        .title {
            color: #2d1b6e;
            font-weight: 800;
        }

        .subtitle {
            color: #7a6a9a;
        }

        .info-item {
            background: #f8f0fc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
        }

        .btn-map {
            background: linear-gradient(135deg, #d44de8, #b020cc);
            border: none;
            color: white;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-map:hover {
            color: white;
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white">
        <div class="container-fluid px-4">

            <a class="navbar-brand" href="/">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="HomeStore" style="height:80px;">
            </a>

            <div class="d-flex align-items-center gap-4 ms-auto">
                <a class="nav-link" href="/">Inicio</a>
                <a class="nav-link" href="/products">Productos</a>
                <a class="nav-link" href="/categories">Categorías</a>
                <a class="nav-link" href="/cart">Carrito</a>
                <a class="nav-link active" href="/location">Ubicación</a>

                <div class="d-flex gap-1 ms-3">
                    <button class="btn-lang">ES</button>
                    <button class="btn-lang">EN</button>
                </div>

                <button class="btn-sesion ms-2">
                    Inicio de Sesion
                </button>
            </div>
        </div>
    </nav>

    <div class="container py-5">

        <div class="location-card text-center">

            <h1 class="title mb-3">
                📍 Nuestra Ubicación
            </h1>

            <p class="subtitle mb-5">
                Visítanos en nuestra tienda física y conoce nuestros productos personalmente.
            </p>

            <div class="info-item">
                <h5>Dirección</h5>
                <p>San José, Costa Rica</p>
            </div>

            <div class="info-item">
                <h5>Horario</h5>
                <p>Lunes a Sábado: 8:00 a.m. - 6:00 p.m.</p>
            </div>

            <div class="info-item">
                <h5>Teléfono</h5>
                <p>2222-2222</p>
            </div>

            <div class="mt-4">
                <a href="https://maps.google.com" target="_blank" class="btn-map">
                    Ver ubicación en Google Maps
                </a>
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
