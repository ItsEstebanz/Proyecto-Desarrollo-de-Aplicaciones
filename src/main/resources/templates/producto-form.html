<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${producto.productId == null
            ? #messages.msg('productoForm.pagina.agregar')
            : #messages.msg('productoForm.pagina.editar')}">
        Producto | HomeStore
    </title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ead7f5;
            color: #25144f;
        }

        .layout {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 250px;
            min-height: 100vh;
            padding: 28px 18px;
            background-color: #ffffff;
            border-right: 1px solid #eee4f3;
        }

        .logo {
            margin-bottom: 38px;
            text-align: center;
        }

        .logo img {
            width: 110px;
            max-width: 100%;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu a {
            display: block;
            padding: 15px 18px;
            border-radius: 12px;
            color: #2b195c;
            font-size: 17px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .menu a:hover {
            background-color: #f1e8f8;
        }

        .menu a.active {
            color: #ffffff;
            background: linear-gradient(90deg, #7639d6, #9e3ddb);
        }

        .content {
            width: calc(100% - 250px);
            padding: 35px;
        }

        .topbar {
            margin-bottom: 28px;
            padding: 24px 28px;
            border-radius: 18px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 5px 18px rgba(59, 31, 99, 0.08);
        }

        .topbar h2 {
            font-size: 30px;
            color: #23134d;
        }

        .topbar-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            background-color: #a541dc;
            font-size: 21px;
        }

        .form-card {
            max-width: 1050px;
            margin: 0 auto;
            padding: 35px;
            border-radius: 20px;
            background-color: #ffffff;
            box-shadow: 0 8px 26px rgba(62, 31, 100, 0.12);
        }

        .form-title {
            margin-bottom: 28px;
            font-size: 23px;
            color: #2b195c;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 22px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #30205e;
            font-weight: 700;
        }

        .form-control,
        .form-select {
            width: 100%;
            min-height: 48px;
            padding: 11px 14px;
            border: 2px solid #e6dcef;
            border-radius: 10px;
            outline: none;
            font-size: 16px;
            background-color: #ffffff;
            transition: 0.2s;
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #9b3ed8;
            box-shadow: 0 0 0 4px rgba(155, 62, 216, 0.12);
        }

        .form-control.error,
        .form-select.error {
            border-color: #dc3545;
            background-color: #fff8f8;
        }

        .error-message {
            margin-top: 6px;
            color: #dc3545;
            font-size: 14px;
            font-weight: 600;
        }

        .button-row {
            margin-top: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .btn {
            min-width: 140px;
            padding: 13px 22px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-primary {
            color: #ffffff;
            background: linear-gradient(90deg, #8338d8, #b13edc);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 16px rgba(137, 55, 210, 0.27);
        }

        .btn-secondary {
            color: #2b195c;
            background-color: #f0e7f7;
        }

        .btn-secondary:hover {
            background-color: #e2d2ef;
        }

        @media (max-width: 850px) {
            .sidebar {
                width: 200px;
            }

            .content {
                width: calc(100% - 200px);
                padding: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .layout {
                display: block;
            }

            .sidebar {
                width: 100%;
                min-height: auto;
            }

            .content {
                width: 100%;
            }

            .menu {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }

            .form-card {
                padding: 25px 18px;
            }

            .topbar h2 {
                font-size: 23px;
            }

            .button-row {
                flex-direction: column-reverse;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="HomeStore">
            </div>

            <nav class="menu">

                <a th:href="@{/inicio}" href="/inicio" th:text="#{productos.menu.dashboard}">
                    Dashboard
                </a>

                <a th:href="@{/productos}" href="/productos" class="active" th:text="#{menu.productos}">
                    Productos
                </a>

                <a th:href="@{/cart}" href="/cart" th:text="#{menu.carrito}">
                    Carrito
                </a>

                <a href="#" th:text="#{inicio.inventario}">
                    Inventario
                </a>

                <a href="#" th:text="#{inicio.ventas}">
                    Ventas
                </a>

                <a href="#" th:text="#{productos.menu.clientes}">
                    Clientes
                </a>

                <a href="#" th:text="#{inicio.reportes}">
                    Reportes
                </a>

                <a href="#" th:text="#{productos.menu.usuarios}">
                    Usuarios
                </a>

                <a href="#" th:text="#{productos.menu.configuracion}">
                    Configuración
                </a>

                <a th:href="@{/logout}" href="/logout" th:text="#{productos.menu.cerrarSesion}">
                    Cerrar sesión
                </a>

            </nav>

        </aside>

        <main class="content">

            <div class="topbar">

                <h2 th:text="${producto.productId == null
                    ? #messages.msg('productoForm.titulo.agregar')
                    : #messages.msg('productoForm.titulo.actualizar')}">
                    Agregar producto
                </h2>

                <span class="topbar-icon">✦</span>
            </div>

            <section class="form-card">

                <h3 class="form-title" th:text="#{productoForm.informacion}">
                    Información del producto
                </h3>

                <form th:action="@{/productos/guardar}" th:object="${producto}" method="post" novalidate>

                    <input type="hidden" th:field="*{productId}">

                    <div class="form-group">

                        <label for="name" th:text="#{productoForm.nombre}">
                            Nombre del producto
                        </label>

                        <input type="text" id="name" class="form-control"
                            th:classappend="${#fields.hasErrors('name')} ? ' error'" th:field="*{name}"
                            th:placeholder="#{productoForm.nombre.placeholder}" placeholder="Ejemplo: Silla de oficina">

                        <div class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">
                        </div>
                    </div>

                    <div class="form-group">

                        <label for="description" th:text="#{productoForm.descripcion}">
                            Descripción
                        </label>

                        <textarea id="description" class="form-control"
                            th:classappend="${#fields.hasErrors('description')} ? ' error'" th:field="*{description}"
                            th:placeholder="#{productoForm.descripcion.placeholder}"
                            placeholder="Escriba una descripción del producto">
                    </textarea>

                        <div class="error-message" th:if="${#fields.hasErrors('description')}"
                            th:errors="*{description}">
                        </div>
                    </div>

                    <div class="form-row">

                        <div class="form-group">

                            <label for="category" th:text="#{productoForm.categoria}">
                                Categoría
                            </label>

                            <select id="category" class="form-select"
                                th:classappend="${#fields.hasErrors('category')} ? ' error'" th:field="*{category}">

                                <option value="" th:text="#{productoForm.categoria.seleccionar}">
                                    Seleccione una categoría
                                </option>

                                <option th:each="categoria : ${categorias}" th:value="${categoria.categoryId}"
                                    th:text="${categoria.name}">
                                </option>

                            </select>

                            <div class="error-message" th:if="${#fields.hasErrors('category')}" th:errors="*{category}">
                            </div>
                        </div>

                        <div class="form-group">

                            <label for="supplier" th:text="#{productoForm.proveedor}">
                                Proveedor
                            </label>

                            <select id="supplier" class="form-select"
                                th:classappend="${#fields.hasErrors('supplier')} ? ' error'" th:field="*{supplier}">

                                <option value="" th:text="#{productoForm.proveedor.seleccionar}">
                                    Seleccione un proveedor
                                </option>

                                <option th:each="proveedor : ${proveedores}" th:value="${proveedor.supplierId}"
                                    th:text="${proveedor.name}">
                                </option>

                            </select>

                            <div class="error-message" th:if="${#fields.hasErrors('supplier')}" th:errors="*{supplier}">
                            </div>
                        </div>

                        <div class="form-group">

                            <label for="price" th:text="#{productoForm.precioVenta}">
                                Precio de venta
                            </label>

                            <input type="number" id="price" step="0.01" min="0" class="form-control"
                                th:classappend="${#fields.hasErrors('price')} ? ' error'" th:field="*{price}"
                                placeholder="0.00">

                            <div class="error-message" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">
                            </div>
                        </div>

                        <div class="form-group">

                            <label for="costPrice" th:text="#{productoForm.precioCosto}">
                                Precio de costo
                            </label>

                            <input type="number" id="costPrice" step="0.01" min="0" class="form-control"
                                th:classappend="${#fields.hasErrors('costPrice')} ? ' error'" th:field="*{costPrice}"
                                placeholder="0.00">

                            <div class="error-message" th:if="${#fields.hasErrors('costPrice')}"
                                th:errors="*{costPrice}">
                            </div>
                        </div>

                        <div class="form-group full-width">

                            <label for="stock" th:text="#{productoForm.cantidad}">
                                Cantidad disponible
                            </label>

                            <input type="number" id="stock" min="0" class="form-control"
                                th:classappend="${#fields.hasErrors('stock')} ? ' error'" th:field="*{stock}"
                                placeholder="0">

                            <div class="error-message" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}">
                            </div>

                        </div>

                    </div>

                    <div class="button-row">

                        <a th:href="@{/productos}" href="/productos" class="btn btn-secondary"
                            th:text="#{productoForm.cancelar}">
                            Cancelar
                        </a>

                        <button type="submit" class="btn btn-primary" th:text="${producto.productId == null
                                    ? #messages.msg('productoForm.guardar')
                                    : #messages.msg('productoForm.actualizar')}">
                            Guardar producto
                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</body>

</html>
