<!DOCTYPE html>
<html lang="es"
      th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{welcome.tituloPagina}">
        Inicio | HomeStore
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #e8c8f0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .contenedor-inicio {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .card-inicio {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(100, 30, 150, 0.18);
            padding: 3rem;
            max-width: 1050px;
            width: 100%;
            text-align: center;
        }

        .logo-inicio {
            max-width: 360px;
            width: 100%;
            margin-bottom: 2.5rem;
        }

        .titulo {
            color: #2d1b6e;
            font-weight: 800;
            font-size: 2.5rem;
        }

        .usuario {
            color: #2d1b6e;
            font-weight: 700;
            font-size: 1.8rem;
            margin-top: 0.5rem;
        }

        .mensaje {
            color: #4a3570;
            margin-top: 1.5rem;
            margin-bottom: 2rem;
        }

        .idiomas {
            margin-bottom: 2rem;
        }

        .idiomas a {
            color: #2d1b6e;
            font-weight: 700;
            text-decoration: none;
            margin: 0 0.35rem;
        }

        .idiomas a:hover {
            text-decoration: underline;
        }

        .btn-salir {
            display: inline-block;
            background: #0d6efd;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.7rem 1.5rem;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-salir:hover {
            color: white;
            opacity: 0.9;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: white;
            padding: 25px 15px;
            border-right: 1px solid #eee;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 95px;
        }

        .menu a {
            display: block;
            padding: 12px 18px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #2b195c;
            border-radius: 12px;
            font-weight: 600;
        }

        .menu a.active,
        .menu a:hover {
            background: #7b35d8;
            color: white;
        }

        .content {
            flex: 1;
        }
    </style>
</head>

<body>

<div class="layout">

    <aside th:replace="~{fragments/navbar :: sidebar('dashboard')}"></aside>

    <main class="content">

    <div class="contenedor-inicio">

        <div class="card-inicio">

            <img
                th:src="@{/images/logo.png}"
                src="/images/logo.png"
                alt="HomeStore"
                class="logo-inicio">

            <div class="idiomas">
                <a th:href="@{/inicio(lang='es')}">ES</a>
                <span>|</span>
                <a th:href="@{/inicio(lang='en')}">EN</a>
            </div>

            <h1 class="titulo" th:text="#{welcome.bienvenida}">
                ¡Bienvenido!
            </h1>

            <h2 class="usuario" th:text="${usuario.name}">
                Usuario
            </h2>

            <p class="mensaje" th:text="#{welcome.mensaje}">
                Has iniciado sesión correctamente en HomeStore.
            </p>

            <a th:href="@{/logout}"
               class="btn-salir"
               th:text="#{welcome.cerrarSesion}">
                Cerrar sesión
            </a>

        </div>

    </div>

    </main>

</div>

</body>
</html>
