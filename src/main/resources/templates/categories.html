<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{categorias.pagina.titulo}">
        HomeStore - Categorías
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #e8c8f0;
            min-height: 100vh;
        }

        .navbar {
            border-bottom: 1px solid #f0e0f5;
        }

        .nav-link {
            color: #2d1b6e !important;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .nav-link.active {
            font-weight: 700;
        }

        .btn-lang {
            background: none;
            border: none;
            color: #2d1b6e;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0 6px;
        }

        .btn-sesion {
            background: #e8d8f5;
            color: #2d1b6e;
            border: none;
            border-radius: 8px;
            padding: 0.45rem 1.2rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .categories-section {
            padding: 2.5rem 1rem 4rem;
        }

        .page-title {
            color: #2d1b6e;
            font-weight: 800;
            font-size: 2.4rem;
        }

        .page-subtitle {
            color: #6f5a95;
            font-size: 1rem;
        }

        .accordion {
            max-width: 950px;
            margin: auto;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(100, 30, 150, 0.12);
        }

        .accordion-item {
            border: none;
            border-bottom: 1px solid #f0e0f5;
        }

        .accordion-button {
            background: #ffffff;
            color: #2d1b6e;
            font-weight: 700;
            font-size: 1.05rem;
            padding: 1.2rem 1.5rem;
        }

        .accordion-button:not(.collapsed) {
            background: #f8f0fc;
            color: #2d1b6e;
            box-shadow: none;
        }

        .accordion-button:focus {
            box-shadow: none;
            border-color: transparent;
        }

        .category-icon {
            color: #9b2fc2;
            font-size: 1.25rem;
            margin-right: 0.65rem;
        }

        .accordion-body {
            background: #ffffff;
            padding: 1rem 1.5rem 1.4rem;
        }

        .category-description {
            color: #7a6a9a;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .product-list {
            list-style: none;
            padding-left: 0;
            margin: 0;
        }

        .product-item {
            background: #faf7fd;
            color: #4a3570;
            border-radius: 12px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.7rem;
            font-weight: 500;

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .product-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .check {
            color: #37a66b;
            font-weight: bold;
            font-size: 1rem;
        }

        .badge-status {
            border-radius: 20px;
            padding: 0.45rem 0.8rem;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-disponible {
            background: #dff7e8;
            color: #168a43;
        }

        .status-pocas {
            background: #fff0d8;
            color: #c76b00;
        }

        .status-agotado {
            background: #ffe0e0;
            color: #b42323;
        }

        @media (max-width: 768px) {

            .navbar .d-flex {
                gap: 0.8rem !important;
                flex-wrap: wrap;
            }

            .page-title {
                font-size: 2rem;
            }

            .product-item {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>

</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-white">

        <div class="container-fluid px-4">

            <a class="navbar-brand" th:href="@{/}">

                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="HomeStore" style="height: 80px;">

            </a>

            <div class="d-flex align-items-center gap-4 ms-auto">

                <a class="nav-link" th:href="@{/}" th:text="#{menu.inicio}">
                    Inicio
                </a>

                <a class="nav-link" th:href="@{/productos}" th:text="#{menu.productos}">
                    Productos
                </a>

                <a class="nav-link active" th:href="@{/categories}" th:text="#{menu.categorias}">
                    Categorías
                </a>

                <a class="nav-link" th:href="@{/cart}" th:text="#{menu.carrito}">
                    Carrito
                </a>

                <a class="nav-link" th:href="@{/nosotros}" th:text="#{menu.nosotros}">
                    Nosotros
                </a>

                <a class="nav-link" th:href="@{/contacto}" th:text="#{menu.contacto}">
                    Contacto
                </a>

                <a class="nav-link" th:href="@{/location}" th:text="#{menu.ubicacion}">
                    Ubicación
                </a>

                <a class="nav-link" href="#" data-bs-toggle="modal" data-bs-target="#opinionModal"
                    th:text="#{menu.opinion}">
                    Opinión
                </a>

                <a class="btn-lang text-decoration-none" th:href="@{/categories(lang='es')}">
                    ES
                </a>

                <a class="btn-lang text-decoration-none" th:href="@{/categories(lang='en')}">
                    EN
                </a>

                <a class="btn-sesion ms-2 text-decoration-none" th:href="@{/inicio}" th:text="#{menu.iniciarSesion}">
                    Inicio de Sesión
                </a>

            </div>

        </div>

    </nav>


    <main class="categories-section">

        <div class="text-center mb-5">

            <h1 class="page-title" th:text="#{categorias.titulo}">
                Categorías
            </h1>

            <p class="page-subtitle" th:text="#{categorias.subtitulo}">
                Explora nuestros productos organizados por categoría.
            </p>

        </div>

        <div class="accordion" id="accordionCategorias">

            <div class="accordion-item" th:each="categoria : ${categorias}">

                <h2 class="accordion-header">

                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:attr="data-bs-target='#categoria' + ${categoria.categoryId},
                                 aria-controls='categoria' + ${categoria.categoryId}">

                        <i class="bi bi-tags category-icon"></i>

                        <span th:text="${categoria.name}">
                            Categoría
                        </span>

                    </button>

                </h2>

                <div class="accordion-collapse collapse" th:id="'categoria' + ${categoria.categoryId}"
                    data-bs-parent="#accordionCategorias">

                    <div class="accordion-body">

                        <p class="category-description" th:text="${categoria.description}">

                            Descripción de la categoría

                        </p>

                        <ul class="product-list">

                            <li class="product-item" th:each="producto : ${productos}" th:if="${producto.category != null
                                and producto.category.categoryId
                                == categoria.categoryId}">

                                <span class="product-name">

                                    <span class="check">
                                        ✓
                                    </span>

                                    <span th:text="${producto.name}">
                                        Producto
                                    </span>

                                </span>

                                <span class="badge-status status-disponible" th:if="${producto.stock != null
                                      and producto.stock > 10}" th:text="#{categorias.estado.disponible}">

                                    Disponible

                                </span>

                                <span class="badge-status status-pocas" th:if="${producto.stock != null
                                      and producto.stock > 0
                                      and producto.stock <= 10}" th:text="#{categorias.estado.pocas}">

                                    Pocas unidades

                                </span>

                                <span class="badge-status status-agotado" th:if="${producto.stock == null
                                      or producto.stock <= 0}" th:text="#{categorias.estado.agotado}">

                                    Agotado

                                </span>

                            </li>

                        </ul>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
