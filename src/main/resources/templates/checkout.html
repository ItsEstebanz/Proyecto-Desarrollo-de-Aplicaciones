<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{checkout.pagina.titulo}">
        Confirmar compra | HomeStore
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #ead8f5;
            color: #2b195c;
        }

        .container {
            width: min(1100px, 92%);
            margin: 40px auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
        }

        .back-link {
            text-decoration: none;
            color: #6f35b7;
            font-weight: 700;
        }

        .checkout-grid {
            display: grid;
            grid-template-columns: 1.4fr 0.8fr;
            gap: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 18px;
            padding: 26px;
            box-shadow: 0 8px 24px rgba(61, 32, 95, 0.12);
        }

        .card h2 {
            margin-top: 0;
        }

        .product-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 16px;
            padding: 16px 0;
            border-bottom: 1px solid #eee4f3;
        }

        .product-item:last-child {
            border-bottom: none;
        }

        .product-name {
            font-weight: 700;
        }

        .product-details {
            margin-top: 6px;
            color: #716584;
            font-size: 14px;
        }

        .subtotal {
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
        }

        select {
            width: 100%;
            min-height: 48px;
            border: 2px solid #e5d9ee;
            border-radius: 10px;
            padding: 10px 12px;
            font-size: 16px;
            background: #ffffff;
        }

        select:focus {
            outline: none;
            border-color: #923bd2;
            box-shadow: 0 0 0 4px rgba(146, 59, 210, 0.12);
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 14px 0;
        }

        .summary-total {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 2px solid #eee4f3;
            font-size: 20px;
            font-weight: 800;
        }

        .shipping-cost {
            color: #6d2cad;
            font-weight: 700;
        }

        .btn-confirm {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 11px;
            background: linear-gradient(90deg, #7d35d4, #b43bdc);
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 7px 18px rgba(117, 47, 188, 0.25);
        }

        .alert {
            margin-bottom: 20px;
            padding: 14px;
            border-radius: 10px;
            font-weight: 700;
        }

        .alert-error {
            color: #8d2323;
            background: #fde2e2;
            border: 1px solid #f0b2b2;
        }

        @media (max-width: 800px) {
            .checkout-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="header">

            <h1 th:text="#{checkout.titulo}">
                Confirmar compra
            </h1>

            <a th:href="@{/cart}" href="/cart" class="back-link" th:text="#{checkout.volverCarrito}">
                Volver al carrito
            </a>

        </div>

        <div class="alert alert-error" th:if="${mensajeError}" th:text="${mensajeError}">
        </div>

        <div class="checkout-grid">

            <section class="card">

                <h2 th:text="#{checkout.productos}">
                    Productos
                </h2>

                <div class="product-item" th:each="item : ${carrito.items}">

                    <div>

                        <div class="product-name" th:text="${item.product.name}">
                            Producto
                        </div>

                        <div class="product-details">

                            <span th:text="#{checkout.cantidad}">
                                Cantidad
                            </span>:

                            <span th:text="${item.quantity}">
                                1
                            </span>

                            ·

                            <span th:text="#{checkout.precio}">
                                Precio
                            </span>:

                            ₡<span th:text="${#numbers.formatDecimal(item.unitPrice, 1, 2)}">
                                0.00
                            </span>

                        </div>

                    </div>

                    <div class="subtotal">

                        ₡<span th:text="${#numbers.formatDecimal(item.subtotal, 1, 2)}">
                            0.00
                        </span>

                    </div>

                </div>

            </section>

            <section class="card">

                <h2 th:text="#{checkout.datosCompra}">
                    Datos de la compra
                </h2>

                <form th:action="@{/checkout/confirmar}" method="post">

                    <div class="form-group">

                        <label for="paymentMethodId" th:text="#{checkout.metodoPago}">
                            Método de pago
                        </label>

                        <select id="paymentMethodId" name="paymentMethodId" required>

                            <option value="" th:text="#{checkout.seleccionarOpcion}">
                                Seleccione una opción
                            </option>

                            <option th:each="metodo : ${metodosPago}" th:value="${metodo.methodId}"
                                th:text="${metodo.name}">
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="shippingMethodId" th:text="#{checkout.metodoEnvio}">
                            Método de envío
                        </label>

                        <select id="shippingMethodId" name="shippingMethodId" required>

                            <option value="" th:text="#{checkout.seleccionarOpcion}">
                                Seleccione una opción
                            </option>

                            <option th:each="envio : ${metodosEnvio}" th:value="${envio.methodId}"
                                th:text="${envio.name + ' - ₡' + envio.cost}" th:attr="data-cost=${envio.cost}">
                            </option>

                        </select>

                    </div>

                    <div class="form-group">

                        <label for="locationId" th:text="#{checkout.sucursal}">
                            Sucursal
                        </label>

                        <select id="locationId" name="locationId" required>

                            <option value="" th:text="#{checkout.seleccionarSucursal}">
                                Seleccione una sucursal
                            </option>

                            <option th:each="sucursal : ${sucursales}" th:value="${sucursal.locationId}"
                                th:text="${sucursal.name}">
                            </option>

                        </select>

                    </div>

                    <div class="summary-row">

                        <span th:text="#{checkout.subtotal}">
                            Subtotal
                        </span>

                        <span>
                            ₡<span id="subtotal" th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">
                                0.00
                            </span>
                        </span>

                    </div>

                    <div class="summary-row">

                        <span th:text="#{checkout.costoEnvio}">
                            Costo de envío
                        </span>

                        <span class="shipping-cost">
                            ₡<span id="shippingCost">0.00</span>
                        </span>

                    </div>

                    <div class="summary-row summary-total">

                        <span th:text="#{checkout.total}">
                            Total
                        </span>

                        <span>
                            ₡<span id="total" th:text="${#numbers.formatDecimal(subtotal, 1, 2)}">
                                0.00
                            </span>
                        </span>

                    </div>

                    <button type="submit" class="btn-confirm" th:text="#{checkout.confirmar}">
                        Confirmar compra
                    </button>

                </form>

            </section>

        </div>

    </main>

    <script>
        const shippingSelect = document.getElementById("shippingMethodId");
        const subtotalElement = document.getElementById("subtotal");
        const shippingCostElement = document.getElementById("shippingCost");
        const totalElement = document.getElementById("total");

        function parseAmount(value) {
            return Number(
                String(value)
                    .replace(/\s/g, "")
                    .replace(/,/g, "")
            ) || 0;
        }

        shippingSelect.addEventListener("change", function () {
            const selectedOption =
                shippingSelect.options[shippingSelect.selectedIndex];

            const shippingCost =
                parseAmount(selectedOption.dataset.cost);

            const subtotal =
                parseAmount(subtotalElement.textContent);

            shippingCostElement.textContent =
                shippingCost.toFixed(2);

            totalElement.textContent =
                (subtotal + shippingCost).toFixed(2);
        });
    </script>

</body>

</html>
