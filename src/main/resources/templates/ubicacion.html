<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ubicación | HomeStore</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #e8c8f0; min-height: 100vh; }
        .card-info {
            background: rgba(255,255,255,0.9);
            border-radius: 18px;
            box-shadow: 0 20px 45px rgba(100, 30, 150, 0.18);
            padding: 3rem;
        }
        .titulo { color: #2d1b6e; font-weight: 800; }
        .dato { color: #4a3570; font-size: 1.2rem; }
        .btn-volver {
            background: linear-gradient(135deg, #d44de8, #b020cc);
            color: white;
            border-radius: 10px;
            padding: 0.7rem 1.6rem;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="card-info">
        <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="HomeStore" style="height: 90px;" class="mb-4">

        <h1 class="titulo mb-4">Ubicación</h1>

        <p class="dato">San José, Costa Rica</p>

        <a href="/" class="btn-volver">Volver al inicio</a>
    </div>
</div>

</body>
</html>
