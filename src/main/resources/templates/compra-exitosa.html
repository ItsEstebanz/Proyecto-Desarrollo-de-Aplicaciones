<!DOCTYPE html>
<html lang="es" th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="#{compraExitosa.pagina.titulo}">
        Compra exitosa | HomeStore
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ead8f5, #f7effc);
            color: #2b195c;
        }

        .success-card {
            width: min(620px, 100%);
            padding: 42px;
            text-align: center;
            background: #ffffff;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(80, 40, 120, 0.16);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e7d5fa;
            color: #7d35d4;
            font-size: 48px;
            font-weight: bold;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 34px;
        }

        .message {
            margin-bottom: 28px;
            color: #716584;
            font-size: 17px;
        }

        .details {
            margin: 25px 0;
            padding: 20px;
            text-align: left;
            background: #f8f3fc;
            border-radius: 14px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 10px 0;
            border-bottom: 1px solid #e6dcef;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 700;
        }

        .total {
            color: #7d35d4;
            font-size: 20px;
            font-weight: 800;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 13px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
        }

        .btn-primary {
            background: linear-gradient(90deg, #7d35d4, #b43bdc);
            color: #ffffff;
        }

        .btn-secondary {
            background: #eee5f7;
            color: #54258e;
        }
    </style>
</head>

<body>

    <section class="success-card">

        <div class="icon">✓</div>

        <h1 th:text="#{compraExitosa.titulo}">
            ¡Compra realizada!
        </h1>

        <p class="message" th:text="#{compraExitosa.mensaje}">
            Tu compra fue registrada correctamente en HomeStore.
        </p>

        <div class="details">

            <div class="detail-row">

                <span class="label" th:text="#{compraExitosa.factura}">
                    Número de factura
                </span>

                <span th:text="${venta.invoiceNumber}">
                    HS-0000
                </span>

            </div>

            <div class="detail-row">

                <span class="label" th:text="#{compraExitosa.estado}">
                    Estado
                </span>

                <span th:text="${venta.status}">
                    COMPLETED
                </span>

            </div>

            <div class="detail-row">

                <span class="label" th:text="#{compraExitosa.metodoPago}">
                    Método de pago
                </span>

                <span th:text="${venta.paymentMethod.name}">
                    Pago
                </span>

            </div>

            <div class="detail-row">

                <span class="label" th:text="#{compraExitosa.metodoEnvio}">
                    Método de envío
                </span>

                <span th:text="${venta.shippingMethod.name}">
                    Envío
                </span>

            </div>

            <div class="detail-row">

                <span class="label" th:text="#{compraExitosa.sucursal}">
                    Sucursal
                </span>

                <span th:text="${venta.location.name}">
                    Sucursal
                </span>

            </div>

            <div class="detail-row total">

                <span th:text="#{compraExitosa.total}">
                    Total
                </span>

                <span>
                    ₡<span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}">
                        0.00
                    </span>
                </span>

            </div>

        </div>

        <div class="actions">

            <a th:href="@{/productos}" href="/productos" class="btn btn-primary"
                th:text="#{compraExitosa.seguirComprando}">
                Seguir comprando
            </a>

            <a th:href="@{/}" href="/" class="btn btn-secondary" th:text="#{compraExitosa.volverInicio}">
                Volver al inicio
            </a>

        </div>

    </section>

</body>

</html>
