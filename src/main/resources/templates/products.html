<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title th:text="#{productos.pagina.titulo}">
        Productos
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #efd6f7;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: white;
            padding: 25px 15px;
            border-right: 1px solid #eee;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 95px;
        }

        .menu a {
            display: block;
            padding: 12px 18px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #2b195c;
            border-radius: 12px;
            font-weight: 600;
        }

        .menu a.active,
        .menu a:hover {
            background: #7b35d8;
            color: white;
        }

        .content {
            flex: 1;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 18px;
            padding: 18px 25px;
            margin-bottom: 25px;
        }

        .card-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .btn-purple {
            background: #b535e6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 9px 18px;
            text-decoration: none;
        }

        .btn-purple:hover {
            background: #9828c7;
            color: white;
        }

        .btn-purple:disabled {
            background: #c7b5cf;
            cursor: not-allowed;
        }

        table {
            background: white;
        }

        th {
            background: #f5ecfb !important;
            color: #2b195c;
        }

        .btn-edit {
            background: #a855f7;
            color: white;
            border-radius: 8px;
            padding: 5px 10px;
            text-decoration: none;
        }

        .btn-delete {
            background: #f87171;
            color: white;
            border-radius: 8px;
            padding: 5px 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="layout">

        <aside class="sidebar">

            <div class="logo">
                <img th:src="@{/images/logo.png}" src="/images/logo.png" alt="HomeStore">
            </div>

            <div class="menu">

                <a th:href="@{/}" th:text="#{productos.menu.dashboard}">
                    Dashboard
                </a>

                <a th:href="@{/productos}" class="active" th:text="#{menu.productos}">
                    Productos
                </a>

                <a th:href="@{/cart}" th:text="#{menu.carrito}">
                    Carrito
                </a>

                <a th:href="@{/productos/inventario}" th:text="#{inicio.inventario}">
                    Inventario
                </a>

                <a href="#" th:text="#{inicio.ventas}">
                    Ventas
                </a>

                <a href="#" th:text="#{productos.menu.clientes}">
                    Clientes
                </a>
                
                <a th:href="@{/reportes}" th:text="#{inicio.reportes}">
                    Reportes
                </a>

                <a href="#" th:text="#{productos.menu.usuarios}">
                    Usuarios
                </a>

                <a href="#" th:text="#{productos.menu.configuracion}">
                    Configuración
                </a>

                <a th:href="@{/logout}" th:text="#{productos.menu.cerrarSesion}">
                    Cerrar sesión
                </a>

            </div>

        </aside>

        <main class="content">

            <div class="topbar">

                <h2 th:text="#{menu.productos}">
                    Productos
                </h2>

                <a th:href="@{/productos/nuevo}" class="btn-purple" th:text="#{productos.nuevo}">
                    Nuevo Producto +
                </a>

            </div>

            <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${ok}">

                <span th:text="${ok}">
                    Operación realizada
                </span>

                <button type="button" class="btn-close" data-bs-dismiss="alert">
                </button>

            </div>

            <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${error}">

                <span th:text="${error}">
                    No se pudo completar la operación
                </span>

                <button type="button" class="btn-close" data-bs-dismiss="alert">
                </button>

            </div>

            <div class="card-box">

                <div class="table-responsive">

                    <table class="table table-bordered align-middle">

                        <thead>

                            <tr>
                                <th th:text="#{productos.tabla.codigo}">
                                    Código
                                </th>

                                <th th:text="#{productos.tabla.nombre}">
                                    Nombre
                                </th>

                                <th th:text="#{productos.tabla.precio}">
                                    Precio
                                </th>

                                <th th:text="#{productos.tabla.costo}">
                                    Costo
                                </th>

                                <th th:text="#{productos.tabla.stock}">
                                    Stock
                                </th>

                                <th th:text="#{productos.tabla.acciones}">
                                    Acciones
                                </th>

                                <th th:text="#{menu.carrito}">
                                    Carrito
                                </th>
                            </tr>

                        </thead>

                        <tbody>

                            <tr th:each="producto : ${productos}">

                                <td th:text="${producto.productId}">
                                    1
                                </td>

                                <td th:text="${producto.name}">
                                    Producto
                                </td>

                                <td th:text="${producto.price}">
                                    0.00
                                </td>

                                <td th:text="${producto.costPrice}">
                                    0.00
                                </td>

                                <td th:text="${producto.stock}">
                                    0
                                </td>

                                <td>

                                    <a th:href="@{/productos/editar/{id}(id=${producto.productId})}" class="btn-edit"
                                        th:title="#{productos.accion.editar}">
                                        ✏️
                                    </a>

                                    <a th:href="@{/productos/eliminar/{id}(id=${producto.productId})}"
                                        class="btn-delete" th:title="#{productos.accion.eliminar}">
                                        🗑️
                                    </a>

                                </td>

                                <td>

                                    <form th:action="@{/cart/agregar/{id}(id=${producto.productId})}" method="post">

                                        <input type="hidden" name="cantidad" value="1">

                                        <button type="submit" class="btn-purple"
                                            th:disabled="${producto.stock == null or producto.stock <= 0}"
                                            th:text="#{productos.agregar}">
                                            Agregar
                                        </button>

                                    </form>

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
