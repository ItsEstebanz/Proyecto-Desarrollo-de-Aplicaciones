<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #efd6f7;
        }

        .layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: white;
            padding: 25px 15px;
            border-right: 1px solid #eee;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo img {
            width: 95px;
        }

        .menu a {
            display: block;
            padding: 12px 18px;
            margin-bottom: 8px;
            text-decoration: none;
            color: #2b195c;
            border-radius: 12px;
            font-weight: 600;
        }

        .menu a.active,
        .menu a:hover {
            background: #7b35d8;
            color: white;
        }

        .content {
            flex: 1;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            border-radius: 18px;
            padding: 18px 25px;
            margin-bottom: 25px;
        }

        .card-box {
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .btn-purple {
            background: #b535e6;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 9px 18px;
            text-decoration: none;
        }

        .btn-purple:hover {
            background: #9828c7;
            color: white;
        }

        table {
            background: white;
        }

        th {
            background: #f5ecfb !important;
            color: #2b195c;
        }

        .btn-edit {
            background: #a855f7;
            color: white;
            border-radius: 8px;
            padding: 5px 10px;
            text-decoration: none;
        }

        .btn-delete {
            background: #f87171;
            color: white;
            border-radius: 8px;
            padding: 5px 10px;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="layout">

    <aside class="sidebar">
        <div class="logo">
            <img src="/images/logo.png" alt="HomeStore">
        </div>

        <div class="menu">
            <a href="/">Dashboard</a>
            <a href="/productos" class="active">Productos</a>
            <a href="#">Inventario</a>
            <a href="#">Ventas</a>
            <a href="#">Clientes</a>
            <a href="#">Reportes</a>
            <a href="#">Usuarios</a>
            <a href="#">Configuración</a>
            <a href="/">Cerrar sesión</a>
        </div>
    </aside>

    <main class="content">

        <div class="topbar">
            <h2>Productos</h2>
            <a href="/productos/nuevo" class="btn-purple">Nuevo Producto +</a>
        </div>

        <div class="card-box">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Precio</th>
                    <th>Costo</th>
                    <th>Stock</th>
                    <th>Acciones</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="producto : ${productos}">
                    <td th:text="${producto.productId}"></td>
                    <td th:text="${producto.name}"></td>
                    <td th:text="${producto.price}"></td>
                    <td th:text="${producto.costPrice}"></td>
                    <td th:text="${producto.stock}"></td>
                    <td>
                        <a th:href="@{/productos/editar/{id}(id=${producto.productId})}" class="btn-edit">✏️</a>
                        <a th:href="@{/productos/eliminar/{id}(id=${producto.productId})}" class="btn-delete">🗑️</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </main>

</div>

</body>
</html>
