spring.application.name=homestore
server.port=8081

# Recargar plantillas Thymeleaf sin reiniciar
spring.thymeleaf.cache=false

# Conexión a MySQL (SIN contraseña real)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/homestoredb}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:cambiame_local}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.root=INFO
logging.level.com.ufide.homestore=DEBUG

spring.profiles.include=local